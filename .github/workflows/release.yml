name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    # Upstream job. The changesets bot opens a version PR against the repo it
    # runs in, then tags the release once that PR merges. In a fork the PR step
    # fails, because Actions is not allowed to create pull requests by default,
    # and the changelog it writes is hard-coded to mattpocock/skills anyway.
    # Skip it anywhere but the upstream repo.
    if: github.repository == 'mattpocock/skills'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create Version Pull Request
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
